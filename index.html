<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRANSBORDO - Acompanhamento em Tempo Real</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#eef1f5;color:#172231}
header{background:#09111e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900}
.logo span{color:#ed1c24}
.wrap{max-width:1250px;margin:auto;padding:18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 4px 18px #0001}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.card-header h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px;margin:5px 0 10px}
.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}
.red{background:#ed1c24;color:white}
.green{background:#159447;color:white}
.dark{background:#09111e;color:white}
.light{background:#edf1f5}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-top:1px solid #eee;text-align:left;font-size:12px}
.step-badge{display:inline-block;padding:4px 8px;border-radius:6px;color:white;font-weight:bold;font-size:11px}
.status-online{font-size:11px;background:#159447;color:white;padding:3px 8px;border-radius:12px;margin-left:10px}
.hidden{display:none !important}

/* Cards do Painel do Motorista */
.driver-card{border:1px solid #e0e0e0;border-radius:10px;padding:15px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px #0000000d}
.driver-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.driver-card-title{font-size:16px;font-weight:bold;color:#09111e}
.driver-card-info{font-size:13px;color:#555;margin-bottom:10px;line-height:1.4}
.driver-card-status{text-align:center;padding:10px;border-radius:6px;font-weight:bold;font-size:14px;margin-top:8px}
</style>

<!-- Scripts do Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <div class="logo">TRAN<span>S</span><small style="display:block;font-size:9px;letter-spacing:5px;color:#aaa">TRANSBORDO <span class="status-online">AO VIVO</span></small></div>
  <button id="btnSwitch" class="btn light" onclick="toggleModo()">📱 Painel Motoristas</button>
</header>

<!-- PAINEL ADMINISTRATIVO -->
<div class="wrap" id="adm">
  <div class="card">
    <h2>Nova Carga</h2>
    <div class="grid">
      <div>Número da Carga<input id="nid" placeholder="Ex: 45821"></div>
      <div>Placa<input id="np" placeholder="Ex: ABC-1D23"></div>
      <div>Motorista<input id="nd" placeholder="Ex: João Silva"></div>
      <div>Destino<input id="nc" placeholder="Ex: Ribeirão Preto - SP"></div>
    </div>
    <button class="btn red" onclick="nova()">Cadastrar Carga</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Cargas do Dia</h2>
      <button class="btn green" onclick="exportarCSV()">📥 Baixar Relatório (CSV)</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Carga</th>
            <th>Motorista / Placa</th>
            <th>Destino</th>
            <th>Início Carreg.</th>
            <th>Fim Carreg.</th>
            <th>Tempo Carreg.</th>
            <th>Status Atual</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- PAINEL DOS MOTORISTAS (EXIBE TODAS AS CARGAS DO DIA) -->
<div class="wrap hidden" id="mot">
  <div class="card">
    <h2>🚚 Painel de Cargas do Dia</h2>
    <p style="color:#666;font-size:12px;margin-top:-5px">Acompanhamento de status em tempo real</p>
    <div id="driverList"></div>
  </div>
</div>

<script>
// CONFIGURAÇÃO DO FIREBASE (Substitua com suas chaves do Firebase Console)
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://SEU_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "SEU_PROJECT_ID",
  storageBucket: "SEU_PROJECT_ID.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const st=['Separação','Conferindo','Pronto para carregar','Doca','Finalizado'],
      co=['#e0a400','#1976d2','#f57c00','#7138c8','#159447'];

let cs = [];

// Escuta em tempo real no banco de dados para sincronizar todos os celulares
db.ref('cargas').on('value', (snapshot) => {
  const data = snapshot.val();
  cs = data ? Object.values(data) : [];
  renderADM();
  renderMotoristas();
});

function getTodayString() {
  return new Date().toISOString().slice(0, 10);
}

function nova(){
  let today = getTodayString();
  let idVal = nid.value.trim();
  if(!idVal || !nd.value || !np.value || !nc.value) return alert('Preencha todos os campos da carga');
  if(cs.some(x => x.id == idVal)) return alert('Carga já existe');

  let c = {
    id: idVal,
    d: nd.value,
    p: np.value,
    c: nc.value,
    s: 'Separação',
    dock: '',
    loadStart: null,
    loadEnd: null,
    createdAt: today
  };

  db.ref('cargas/' + idVal).set(c);

  nid.value = ''; np.value = ''; nd.value = ''; nc.value = '';
}

function calcDuration(startStr, endStr) {
  if (!startStr) return '-';
  let start = new Date(startStr);
  let end = endStr ? new Date(endStr) : new Date();
  let diffMs = end - start;
  if (diffMs < 0) return '-';
  let mins = Math.floor(diffMs / 60000);
  let hrs = Math.floor(mins / 60);
  mins = mins % 60;
  return hrs > 0 ? `${hrs}h ${mins}min` : `${mins}min`;
}

function formatTime(isoStr) {
  if (!isoStr) return '-';
  let d = new Date(isoStr);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// Renderiza a tabela do Painel Administrativo
function renderADM(){
  let today = getTodayString();
  let cargasHoje = cs.filter(c => (c.createdAt || today) === today);

  if (cargasHoje.length === 0) {
    rows.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#888;padding:20px;">Nenhuma carga cadastrada hoje.</td></tr>`;
    return;
  }

  rows.innerHTML = cargasHoje.map(c => {
    let statusIndex = st.indexOf(c.s);
    let color = co[statusIndex] || '#333';
    return `
      <tr>
        <td><strong>${c.id}</strong></td>
        <td>${c.d}<br><small style="color:#666">${c.p}</small></td>
        <td>${c.c}</td>
        <td>${formatTime(c.loadStart)}</td>
        <td>${formatTime(c.loadEnd)}</td>
        <td><strong>${calcDuration(c.loadStart, c.loadEnd)}</strong></td>
        <td><span class="step-badge" style="background:${color}">${c.s}${c.dock ? ' — Doca ' + c.dock : ''}</span></td>
        <td>
          <button class="btn dark" onclick="status('${c.id}')">Avançar Status</button>
        </td>
      </tr>
    `;
  }).join('');
}

// Renderiza o Painel Público dos Motoristas
function renderMotoristas(){
  let today = getTodayString();
  let cargasHoje = cs.filter(c => (c.createdAt || today) === today);

  if (cargasHoje.length === 0) {
    driverList.innerHTML = `<div style="text-align:center;color:#888;padding:20px;">Nenhuma carga cadastrada para hoje.</div>`;
    return;
  }

  driverList.innerHTML = cargasHoje.map(c => {
    let statusIndex = st.indexOf(c.s);
    let color = co[statusIndex] || '#333';
    let isDoca = c.s === 'Doca';
    let isDone = c.s === 'Finalizado';

    return `
      <div class="driver-card">
        <div class="driver-card-header">
          <div class="driver-card-title">Carga #${c.id}</div>
          <span class="step-badge" style="background:${color}">${c.s}</span>
        </div>
        <div class="driver-card-info">
          <strong>Motorista:</strong> ${c.d} | <strong>Placa:</strong> ${c.p}<br>
          <strong>Destino:</strong> ${c.c}<br>
          ${c.loadStart ? `<strong>Carregamento:</strong> Início às ${formatTime(c.loadStart)}` : ''}
        </div>
        <div class="driver-card-status" style="background:${isDone ? '#eaf8ef' : (isDoca ? '#fff1e6' : '#f0f4f8')}; color:${isDone ? '#087136' : (isDoca ? '#954700' : '#333')}; border: 1px solid ${color}">
          ${isDoca ? '🚨 DIRIJA-SE À DOCA ' + c.dock : (isDone ? '✅ CARREGAMENTO FINALIZADO' : '⏳ Status: ' + c.s.toUpperCase())}
        </div>
      </div>
    `;
  }).join('');
}

function status(id){
  let c = cs.find(x => x.id == id);
  let currentIndex = st.indexOf(c.s);
  if (currentIndex >= st.length - 1) return alert('Esta carga já está Finalizada!');

  let nextStatus = st[currentIndex + 1];

  // Inicia a contagem do tempo de carregamento ao chegar no status 'Pronto para carregar'
  if (nextStatus === 'Pronto para carregar' && !c.loadStart) {
    c.loadStart = new Date().toISOString();
  }

  if (nextStatus === 'Doca') {
    let dockNum = prompt('Digite o número da Doca:', '04');
    if (!dockNum) return;
    c.dock = dockNum;
  }

  if (nextStatus === 'Finalizado') {
    c.loadEnd = new Date().toISOString();
  }

  c.s = nextStatus;
  db.ref('cargas/' + id).update(c);
}

function exportarCSV() {
  if (cs.length === 0) return alert('Nenhuma carga registrada para exportar.');
  let csvContent = "\uFEFFData;Carga;Motorista;Placa;Destino;Inicio Carreg;Fim Carreg;Tempo Carreg;Status\n";
  cs.forEach(c => {
    let row = [
      `"${c.createdAt || getTodayString()}"`, `"${c.id}"`, `"${c.d}"`, `"${c.p}"`, `"${c.c}"`,
      `"${formatTime(c.loadStart)}"`, `"${formatTime(c.loadEnd)}"`, `"${calcDuration(c.loadStart, c.loadEnd)}"`,
      `"${c.s}${c.dock ? ' - Doca ' + c.dock : ''}"`
    ];
    csvContent += row.join(";") + "\n";
  });
  let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.setAttribute("href", url);
  a.setAttribute("download", `relatorio_transbordo_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function toggleModo(){
  if (adm.classList.contains('hidden')) {
    adm.classList.remove('hidden');
    mot.classList.add('hidden');
    btnSwitch.textContent = '📱 Painel Motoristas';
  } else {
    adm.classList.add('hidden');
    mot.classList.remove('hidden');
    btnSwitch.textContent = '⚙️ Painel ADM';
  }
}
</script>
</body>
</html>
