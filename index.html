<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRANSBORDO</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial;background:#eef1f5;color:#172231}
header{background:#09111e;color:white;padding:18px;display:flex;justify-content:space-between}
.logo{font-size:30px;font-weight:900}
.logo span{color:#ed1c24}
.wrap{max-width:1150px;margin:auto;padding:18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 4px 18px #0001}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.card-header h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px;margin:5px 0 10px}
.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:bold;cursor:pointer}
.red{background:#ed1c24;color:white}
.green{background:#159447;color:white}
.dark{background:#09111e;color:white}
.light{background:#edf1f5}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-top:1px solid #eee;text-align:left;font-size:12px}
.step{padding:12px;margin:7px 0;border-radius:8px;background:#edf0f3;color:#899}
.active{color:white}
.notice{text-align:center;padding:16px;border:2px solid #f57c00;border-radius:9px;background:#fff1e6;color:#954700;font-weight:900;font-size:18px}
.done{border-color:#159447;background:#eaf8ef;color:#087136}
.hidden{display:none}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}
.modalbox{background:white;padding:20px;border-radius:12px;width:min(500px,92vw);text-align:center}
.qr{width:180px;height:180px;margin:15px auto}
.qr img{width:100%}
.times-info{font-size:12px;color:#555;margin-top:8px;background:#f8f9fa;padding:10px;border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="logo">TRAN<span>S</span><small style="display:block;font-size:9px;letter-spacing:5px;color:#aaa">TRANSBORDO</small></div>
  <button class="btn light" onclick="motorista('45821')">📱 Motorista</button>
</header>

<div class="wrap" id="adm">
  <div class="card">
    <h2>Nova carga</h2>
    <div class="grid">
      <div>Número da Carga<input id="nid" value="45821"></div>
      <div>Placa<input id="np" value="ABC-1D23"></div>
      <div>Motorista<input id="nd" value="João Silva"></div>
      <div>Destino<input id="nc" value="Ribeirão Preto - SP"></div>
    </div>
    <button class="btn red" onclick="nova()">Cadastrar carga</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Cargas</h2>
      <button class="btn green" onclick="exportarCSV()">📥 Baixar Relatório (CSV)</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Carga</th>
            <th>Motorista</th>
            <th>Placa</th>
            <th>Destino</th>
            <th>Conferente</th>
            <th>Início</th>
            <th>Término</th>
            <th>Duração</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="wrap hidden" id="mot">
  <div class="card">
    <div id="md" style="font-size:24px;font-weight:bold"></div>
    <div id="mi"></div>
    <div id="mconf" style="font-weight:bold;color:#555;margin-top:4px"></div>
    <div id="mtimes" class="times-info"></div>
    <div id="steps"></div>
    <div id="notice" class="notice"></div>
    <button class="btn red" style="width:100%;margin-top:10px" onclick="push()">🔔 Ativar notificações</button>
    <button class="btn light" style="width:100%;margin-top:8px" onclick="adm()">Voltar</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2>Link da carga</h2>
    <div class="qr"><img id="qr"></div>
    <p id="url" style="word-break:break-all"></p>
    <button class="btn red" onclick="copy()">Copiar</button>
    <button class="btn light" onclick="modal.style.display='none'">Fechar</button>
  </div>
</div>

<script>
const st=['Separação','Conferindo','Pronto para carregar','Doca','Finalizado'],
      co=['#e0a400','#1976d2','#f57c00','#7138c8','#159447'];

let cs = JSON.parse(localStorage.getItem('transbordo') || 'null') || [{
  id: '45821',
  d: 'João Silva',
  p: 'ABC-1D23',
  c: 'Ribeirão Preto - SP',
  conf: '-',
  s: 'Separação',
  dock: '',
  startTime: null,
  endTime: null
}], cur = '45821', u = '';

function save(){ localStorage.setItem('transbordo', JSON.stringify(cs)); }

function nova(){
  let c = {
    id: nid.value,
    d: nd.value,
    p: np.value,
    c: nc.value,
    conf: '-',
    s: 'Separação',
    dock: '',
    startTime: null,
    endTime: null
  };
  if(!c.id || !c.d || !c.p || !c.c) return alert('Preencha todos os campos da carga');
  if(cs.some(x => x.id == c.id)) return alert('Carga já existe');
  cs.unshift(c);
  save();
  render();
}

function calcDuration(startStr, endStr) {
  if (!startStr) return '-';
  let start = new Date(startStr);
  let end = endStr ? new Date(endStr) : new Date();
  let diffMs = end - start;
  if (diffMs < 0) return '-';
  
  let mins = Math.floor(diffMs / 60000);
  let hrs = Math.floor(mins / 60);
  mins = mins % 60;
  return hrs > 0 ? `${hrs}h ${mins}min` : `${mins}min`;
}

function formatTime(isoStr) {
  if (!isoStr) return '-';
  let d = new Date(isoStr);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function render(){
  rows.innerHTML = cs.map(c => `
    <tr>
      <td>${c.id}</td>
      <td>${c.d}</td>
      <td>${c.p}</td>
      <td>${c.c}</td>
      <td>${c.conf || '-'}</td>
      <td>${formatTime(c.startTime)}</td>
      <td>${formatTime(c.endTime)}</td>
      <td><strong>${calcDuration(c.startTime, c.endTime)}</strong></td>
      <td>${c.s}${c.dock ? ' — Doca ' + c.dock : ''}</td>
      <td>
        <button class="btn dark" onclick="status('${c.id}')">Avançar Status</button>
        <button class="btn light" onclick="link('${c.id}')">🔗 Link</button>
      </td>
    </tr>
  `).join('');
}

function status(id){
  let c = cs.find(x => x.id == id);
  let currentIndex = st.indexOf(c.s);
  
  if (currentIndex >= st.length - 1) {
    return alert('Esta carga já está Finalizada!');
  }

  let nextStatus = st[currentIndex + 1];

  // Se avançar para Conferindo, pede o nome do conferente
  if (nextStatus === 'Conferindo') {
    let confName = prompt('Digite o nome do conferente:', c.conf !== '-' ? c.conf : '');
    if (!confName) return; // Cancela a atualização se não digitar
    c.conf = confName;
    if (!c.startTime) c.startTime = new Date().toISOString();
  }

  // Se avançar para Doca, pede o número da doca
  if (nextStatus === 'Doca') {
    let dockNum = prompt('Digite o número da Doca:', '04');
    if (!dockNum) return; // Cancela se não informar a doca
    c.dock = dockNum;
  }

  // Se avançar para Finalizado, grava o horário final
  if (nextStatus === 'Finalizado') {
    c.endTime = new Date().toISOString();
  }

  c.s = nextStatus;
  save();
  render();
  if (cur == id) show();
  if (c.s === 'Doca') alert('🚨 DIRIJA-SE À DOCA ' + c.dock);
  if (c.s === 'Finalizado') alert('✅ CARREGAMENTO FINALIZADO');
}

function exportarCSV() {
  if (cs.length === 0) return alert('Nenhuma carga registrada para exportar.');
  
  let csvContent = "\uFEFF";
  csvContent += "Carga;Motorista;Placa;Destino;Conferente;Inicio;Termino;Duracao;Status\n";
  
  cs.forEach(c => {
    let row = [
      `"${c.id}"`,
      `"${c.d}"`,
      `"${c.p}"`,
      `"${c.c}"`,
      `"${c.conf || '-'}"`,
      `"${formatTime(c.startTime)}"`,
      `"${formatTime(c.endTime)}"`,
      `"${calcDuration(c.startTime, c.endTime)}"`,
      `"${c.s}${c.dock ? ' - Doca ' + c.dock : ''}"`
    ];
    csvContent += row.join(";") + "\n";
  });

  let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.setAttribute("href", url);
  a.setAttribute("download", `relatorio_transbordo_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function link(id){
  cur = id;
  u = location.href.split('#')[0] + '#motorista=' + id;
  url.textContent = u;
  qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(u);
  modal.style.display = 'flex';
}

function copy(){ navigator.clipboard?.writeText(u); alert('Link copiado'); }

function motorista(id){
  cur = id;
  adm.style.display = 'none';
  mot.classList.remove('hidden');
  show();
}

function adm(){
  mot.classList.add('hidden');
  adm.style.display = 'block';
  render();
}

function show(){
  let c = cs.find(x => x.id == cur) || cs[0];
  let i = st.indexOf(c.s);
  md.textContent = c.d;
  mi.textContent = `Carga ${c.id} · ${c.p} · ${c.c}`;
  mconf.textContent = `Conferente: ${c.conf || '-'}`;
  
  mtimes.innerHTML = `
    <strong>Início:</strong> ${formatTime(c.startTime)} | 
    <strong>Término:</strong> ${formatTime(c.endTime)} | 
    <strong>Tempo de Carregamento:</strong> ${calcDuration(c.startTime, c.endTime)}
  `;

  steps.innerHTML = st.map((x, j) => `
    <div class="step ${j <= i ? 'active' : ''}" style="${j <= i ? 'background:' + co[j] : ''}">
      ${j + 1}. ${x}${x === 'Doca' && c.dock ? ' — ' + c.dock : ''}
    </div>
  `).join('');
  
  notice.textContent = c.s === 'Doca' ? '🚨 DIRIJA-SE À DOCA ' + c.dock : (c.s === 'Finalizado' ? '✅ CARREGAMENTO FINALIZADO' : '⏳ ' + c.s.toUpperCase());
  notice.className = 'notice ' + (c.s === 'Finalizado' ? 'done' : '');
}

async function push(){
  if(!('Notification' in window)) return alert('Navegador sem suporte');
  let p = await Notification.requestPermission();
  if(p === 'granted') new Notification('TRANSBORDO', { body: 'Notificações ativadas para a carga ' + cur });
}

setInterval(() => {
  let x = JSON.parse(localStorage.getItem('transbordo') || 'null');
  if(x){ cs = x; render(); show(); }
}, 1000);

render();
</script>
</body>
</html>
